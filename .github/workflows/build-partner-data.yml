name: Refresh Partner Portal Data
# Runs automatically every night (data-only — logins are never touched by the
# schedule) so partners always see current Pearl data without anyone having
# to remember to click anything.
#
# Trigger manually from the Actions tab when:
#   (a) Pearl data changed and you don't want to wait for tonight's run — leave
#       "Update logins too?" set to "no", or
#   (b) you're onboarding a new partner, or rotating someone's PIN — set
#       "Update logins too?" to "yes" and add/edit their entry in the
#       PARTNER_EMAIL_MAP / PARTNER_PIN_MAP secrets first.
#
# Each partner gets partner/data/<token>.json (live school year + year-over-year
# summary) and partner/data/<token>.<season>.json per archived year, loaded
# only when the partner toggles to it. Archived files are deterministic, so
# they don't change (or re-commit) night to night.
#
# Nothing here ever writes a plaintext email or PIN into the repo — only
# SHA-256 hashes (auth/partner-codes.json) and scoped data bundles
# (partner/data/*.json) get committed. See scripts/build-partner-data.js.
on:
  schedule:
    - cron: '0 10 * * *'  # ~5-6am US Eastern, before the school day
  workflow_dispatch:
    inputs:
      UPDATE_LOGINS:
        description: 'Update logins too? (yes = also regenerate auth/partner-codes.json from PARTNER_PIN_MAP; no = data refresh only)'
        required: true
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build partner data bundles (and logins, if requested)
        # github.event.inputs.* only exist for a manual (workflow_dispatch)
        # run — a scheduled run has none of them, so every one of these needs
        # its own fallback rather than relying on the input's declared
        # default (which only applies inside the Actions UI, not here).
        env:
          PARTNER_HMAC_KEY: ${{ secrets.PARTNER_HMAC_KEY }}
          PARTNER_EMAIL_MAP_JSON: ${{ secrets.PARTNER_EMAIL_MAP }}
          PARTNER_PIN_MAP_JSON: ${{ github.event.inputs.UPDATE_LOGINS == 'yes' && secrets.PARTNER_PIN_MAP || '' }}
          # School years (live SY 26-27 + archived SY 25-26) are defined once in
          # partner/partner-report.js (SEASONS) — no per-run inputs needed.
        run: node scripts/build-partner-data.js

      - name: Commit and push
        # The Pearl fetch above can take several minutes, during which other
        # automations in this repo (e.g. the Asana sync workflows) may push
        # their own commits to main. Rebase-and-retry so a same-branch commit
        # landing mid-run doesn't fail this push outright.
        run: |
          git config user.name "njtc-partner-data-bot"
          git config user.email "actions@github.com"
          git add partner/data auth/partner-codes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh partner portal data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — another commit landed on main. Rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          echo "::error::Could not push after 5 attempts — main kept moving. Re-run the workflow."
          exit 1
