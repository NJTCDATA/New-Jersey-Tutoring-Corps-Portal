# NJTC Portal — Asana Task Sync
# ─────────────────────────────────────────────────────────────────
# WHAT THIS DOES:
#   Calls the Asana API every 30 minutes using a stored secret,
#   writes the results to /data/tasks.json, and commits the file
#   back to the repo so GitHub Pages can serve it statically.
#
# WHY THIS APPROACH:
#   GitHub Pages is static — browsers can't call Asana directly
#   (CORS + PAT security). This workflow runs server-side where
#   the PAT is safe, then stores the output as a plain JSON file.
#
# REQUIRED GITHUB SECRET (set once, never changes the code):
#   Go to: GitHub Repo → Settings → Secrets and variables → Actions
#   Add secret named:  ASANA_PAT
#   Value:             Your Asana Personal Access Token
#                      (generate at: https://app.asana.com/0/my-apps)
#
# ⚠️  NEVER paste the PAT value into this file — use GitHub Secrets only.
#
# TO CHANGE THE SCHEDULE:
#   Edit the cron line below. Format is standard Unix cron.
#   Current setting: every 30 minutes, 24/7.
#   Tool to help: https://crontab.guru
#
# TO RUN MANUALLY:
#   GitHub Repo → Actions tab → "Sync Asana Tasks" → Run workflow
#
# NOTE (2026-07-13): This workflow and "Sync Asana Tasks (Project 2)"
# run on the same 30-minute schedule and commit to the same branch.
# When they fire close together, the second push can get rejected
# with "! [rejected] main -> main (fetch first)". The commit step
# below now pulls/rebases immediately before pushing, with a short
# retry loop, so a collision self-heals instead of failing the run.
# ─────────────────────────────────────────────────────────────────

name: Sync Asana Tasks

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: '*/30 * * * *'

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    name: Fetch tasks from Asana and write tasks.json
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # Only the minimum permissions needed
    permissions:
      contents: write   # needed to commit tasks.json back to the repo

    steps:

      # ── 1. Check out the repo ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 24 ───────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── 3. Fetch tasks from Asana API ─────────────────────────
      #
      # We use Node.js inline so no external dependencies are needed.
      # The PAT comes from the GitHub Secret — never hardcoded here.
      #
      - name: Fetch Asana tasks and write tasks.json
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
        run: |
          node - <<'NODESCRIPT'
          const https = require('https');
          const fs    = require('fs');
          const path  = require('path');

          // ── Config ──────────────────────────────────────────────
          const PROJECT_ID = '1211431518555737';
          const FIELDS     = 'name,due_on,assignee,permalink_url,completed,notes,followers';
          const OUT_DIR    = path.join(process.cwd(), 'data');
          const OUT_FILE   = path.join(OUT_DIR, 'tasks.json');
          const PAT        = process.env.ASANA_PAT;

          if (!PAT) {
            console.error('');
            console.error('══════════════════════════════════════════════════════');
            console.error('ERROR: ASANA_PAT secret is not set or is empty.');
            console.error('Fix:   Repo → Settings → Secrets → Actions →');
            console.error('       Add or update secret named ASANA_PAT');
            console.error('       Generate a new PAT at https://app.asana.com/0/my-apps');
            console.error('══════════════════════════════════════════════════════');
            process.exit(1);
          }
          console.log(`ASANA_PAT present (length=${PAT.length})`);

          // ── Fetch from Asana ─────────────────────────────────────
          const BASE_URL = `https://app.asana.com/api/1.0/projects/${PROJECT_ID}/tasks`
                         + `?opt_fields=${encodeURIComponent(FIELDS)}&limit=100`;

          function get(url) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, {
                headers: {
                  'Authorization': `Bearer ${PAT}`,
                  'Accept': 'application/json',
                }
              }, (res) => {
                let body = '';
                res.on('data', chunk => body += chunk);
                res.on('end', () => {
                  console.log(`  Asana HTTP ${res.statusCode} for ${url.slice(0,80)}`);
                  if (res.statusCode !== 200) {
                    // Print the full response body so the error is visible in the log
                    console.error('  Asana error response body:');
                    console.error('  ' + body.slice(0, 1000));
                    if (res.statusCode === 401) {
                      console.error('');
                      console.error('  401 Unauthorized — your ASANA_PAT has expired or is invalid.');
                      console.error('  Generate a new PAT at https://app.asana.com/0/my-apps');
                      console.error('  then update the ASANA_PAT secret in GitHub → Settings → Secrets → Actions');
                    } else if (res.statusCode === 403) {
                      console.error('  403 Forbidden — the PAT does not have access to project ' + PROJECT_ID);
                    } else if (res.statusCode === 404) {
                      console.error('  404 Not Found — project ID ' + PROJECT_ID + ' may be wrong or deleted');
                    }
                    reject(new Error(`Asana returned HTTP ${res.statusCode}`));
                    return;
                  }
                  try { resolve(JSON.parse(body)); }
                  catch (e) { reject(new Error('Invalid JSON from Asana: ' + e.message)); }
                });
              });
              req.on('error', e => {
                console.error('  Network error reaching Asana:', e.message);
                reject(e);
              });
            });
          }

          // ── Paginate through all tasks ────────────────────────────
          async function fetchAll() {
            let allTasks = [];
            let nextUrl  = BASE_URL;
            let page = 0;

            while (nextUrl) {
              page++;
              console.log(`  Fetching page ${page}…`);
              const data = await get(nextUrl);
              if (Array.isArray(data.data)) {
                allTasks = allTasks.concat(data.data);
                console.log(`  Page ${page}: ${data.data.length} tasks (running total: ${allTasks.length})`);
              }
              nextUrl = data.next_page ? data.next_page.uri : null;
            }

            return allTasks;
          }

          // ── Main ──────────────────────────────────────────────────
          (async () => {
            try {
              console.log(`Fetching tasks from Asana project ${PROJECT_ID}…`);
              const tasks = await fetchAll();
              console.log(`Retrieved ${tasks.length} total tasks.`);

              const filtered = tasks.filter(t => !t.completed && t.due_on);
              console.log(`${filtered.length} open tasks with due dates kept.`);

              if (!fs.existsSync(OUT_DIR)) fs.mkdirSync(OUT_DIR, { recursive: true });

              const output = {
                generated: new Date().toISOString(),
                project:   PROJECT_ID,
                count:     filtered.length,
                tasks:     filtered,
              };

              fs.writeFileSync(OUT_FILE, JSON.stringify(output, null, 2));
              console.log(`Written to ${OUT_FILE}`);
              console.log('Sync complete ✓');
            } catch (err) {
              console.error('');
              console.error('══ Sync failed ══════════════════════════════════════');
              console.error(err.message);
              console.error('════════════════════════════════════════════════════');
              process.exit(1);
            }
          })();
          NODESCRIPT

      # ── 4. Commit tasks.json back to the repo ─────────────────
      #
      # Only commits if the file actually changed.
      # The [skip ci] tag prevents this commit from triggering
      # another workflow run (avoids an infinite loop).
      #
      # Pulls/rebases immediately before pushing, and retries a few
      # times on rejection, since "Sync Asana Tasks (Project 2)" runs
      # on the same schedule and can push to main first.
      #
      - name: Commit updated tasks.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/tasks.json

          # Only commit if there's actually a change
          if git diff --cached --quiet; then
            echo "tasks.json is unchanged — nothing to commit."
          else
            TASK_COUNT=$(node -e "const f=require('./data/tasks.json'); console.log(f.count)")
            git commit -m "chore: sync Asana tasks [skip ci]

          Tasks with open deadlines: ${TASK_COUNT}
          Generated: $(date -u +"%Y-%m-%d %H:%M UTC")"

            # Retry push up to 5 times, rebasing on top of remote
            # changes each time, to survive collisions with the
            # sibling "Project 2" sync workflow.
            MAX_ATTEMPTS=5
            ATTEMPT=1
            until git push; do
              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "::error::Push failed after ${MAX_ATTEMPTS} attempts."
                exit 1
              fi
              echo "Push rejected (attempt ${ATTEMPT}/${MAX_ATTEMPTS}) — pulling and retrying…"
              SLEEP_SECONDS=$(( RANDOM % 10 + 3 ))
              sleep "$SLEEP_SECONDS"
              git pull --rebase origin main
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "Committed and pushed updated tasks.json."
          fi
